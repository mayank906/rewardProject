name: SonarQube Scan

on:
  push:
    branches:
      - master    # or whichever branch you want to trigger on
  pull_request:
    branches:
      - master    # or whichever branch you want to trigger on

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Pass token as an environment variable
        run: |
          sonar-scanner -Dsonar.host.url=http://localhost:8080  # Your SonarQube URL
